<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Моё мини-приложение</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: sans-serif;
      background: #1c1c1e;
      color: white;
      text-align: center;
      padding: 40px 20px;
    }
    button {
      padding: 15px 30px;
      font-size: 18px;
      border-radius: 10px;
      border: none;
      background: #2AABEE;
      color: white;
    }
  </style>
</head>
<body>
  <h1>Привет!</h1>
  <p id="user">Загрузка...</p>
  <button onclick="sayHi()">Нажми меня</button>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    const user = tg.initDataUnsafe?.user;
    if (user) {
      document.getElementById('user').innerText = `Ты: ${user.first_name}`;
    } else {
      document.getElementById('user').innerText = 'Не удалось получить имя';
    }

    function sayHi() {
      tg.showAlert('Ты нажал кнопку!');
    }
  </script>
</body>
</html>
